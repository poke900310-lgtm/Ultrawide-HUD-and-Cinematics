; Dawnwalker Ultrawide - shipped defaults, for reference.
;
; DO NOT EDIT THIS FILE. A mod update replaces it. To change a setting, copy it
; to Ultrawide.ini in the same folder and edit that; Ultrawide.ini is yours and
; is never overwritten. Settings are read once at startup - restart after edits.

; Master switch.
Enabled = true

; --- HUD -------------------------------------------------------------------
; Confine the HUD to a centred box of this aspect, so at 21:9 / 32:9 the HUD
; sits where it does at 16:9 instead of flying to the physical edges. Accept a
; ratio ("16:9", "21:9") or a plain number ("1.777778"). At or below this
; aspect the HUD is untouched, so 16:9 users see no change and it is safe at any
; resolution.
HudAspect = 16:9

; Nudge the HUD further inward (+) or outward (-), in layout pixels, on top of
; the aspect box. 0 keeps it exactly at the target aspect.
HudWidthOffset = 0

; Recentre the HUD at all. Turn off to leave the HUD alone and only fix
; cinematics.
RecenterHUD = true

; --- Cinematics ------------------------------------------------------------
; Remove the 16:9 black bars from cinematics by rendering the scene at the full
; screen width.
RemoveCinematicBars = true

; When removing the bars, keep the authored vertical field of view and widen
; horizontally (reveals real scene at the sides). Set false to instead let the
; engine keep the horizontal FOV, which crops top and bottom - almost never what
; you want on an ultrawide display.
KeepVerticalFov = true

; Lift the 30 fps cap the game applies while a cinematic plays. Rendering follows
; your in-game Frame Rate Limit (Options > Graphics; left at your current cap if it
; can't be read), and cutscene animation is stepped at CinematicAnimFps instead of 30.
; VSync is not touched. Turn off to leave cinematics at the game's original 30 fps.
UncapCinematicFps = true

; Frame rate cutscene animation is stepped at while UncapCinematicFps is on. Whole
; number; 60 is smooth on most displays. Never lowers a sequence's own rate.
CinematicAnimFps = 60

; --- Misc ------------------------------------------------------------------
; Optional UE4SS key name (e.g. INS, HOME, END) to toggle the whole mod in game.
; Empty binds nothing. F5 is the game's quicksave; a UE4SS key fires alongside
; the game's own, so avoid keys the game uses.
ToggleKey =

; Also write a log beside main.lua (Ultrawide.log). Off by default.
Verbose = false

; Extra per-trigger / per-pass diagnostic lines (camera passes, HUD base-padding
; capture, which hooks fired) for diagnosing a bar or HUD-position report. Chatty
; and for debugging only; off by default. With Verbose = true these lines also go
; to Ultrawide.log.
Trace = false
